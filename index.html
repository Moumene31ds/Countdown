<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Event Master V10 Glass</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;400;500;700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* ألوان الأساس */
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.5);
            --danger: #f43f5e;
            --success: #10b981;
            --warning: #f59e0b;
            --high: #ef4444;
            --med: #f97316;
            --low: #3b82f6;
            --text: #f8fafc;
            --gradient-1: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            
            /* إعدادات الزجاج (Glassmorphism) */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(16px);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --font-ar: 'Tajawal', sans-serif;
            --font-en: 'Poppins', sans-serif;
        }

        /* --- Global Reset --- */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: var(--font-ar);
            /* خلفية متحركة لإبراز التأثير الزجاجي */
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #111827);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text);
            min-height: 100vh;
            padding-top: calc(var(--safe-top) + 10px);
            padding-bottom: calc(100px + var(--safe-bottom));
            overflow-x: hidden;
            transition: 0.3s;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        html[dir="ltr"] body { font-family: var(--font-en); }
        
        /* الفئة المساعدة للزجاج */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* --- Navbar & Controls --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; 
            background: rgba(15, 23, 42, 0.4); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100; 
            border-bottom: 1px solid var(--glass-border);
            margin-top: -10px;
        }
        .logo { 
            font-size: 1.5rem; font-weight: 900; 
            background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            text-shadow: 0 0 20px var(--accent-glow);
        }
        
        .nav-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn { 
            background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
            color: var(--text); width: 42px; height: 42px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s;
            backdrop-filter: blur(5px);
        }
        .icon-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .icon-btn:active { transform: scale(0.92); }

        /* Language Select */
        .lang-select {
            background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--glass-border);
            padding: 5px 10px; border-radius: 12px; font-size: 0.85rem; cursor: pointer;
            height: 42px; backdrop-filter: blur(5px);
        }
        .lang-select option { background: #1e293b; color: #fff; }

        /* --- Weather Widget --- */
        .weather-widget {
            margin: 20px 20px 10px; padding: 20px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(147, 51, 234, 0.15));
            border-radius: 24px; border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: var(--glass-blur); box-shadow: var(--glass-shadow);
            transition: 0.3s;
        }
        .weather-widget:hover { border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }

        /* --- Dashboard Stats --- */
        .dashboard-row { padding: 10px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-card {
            background: var(--glass-bg); padding: 15px; border-radius: 20px; 
            display: flex; flex-direction: column; align-items: center; text-align: center;
            border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.1); }
        .stat-val { font-size: 1.4rem; font-weight: 800; font-family: var(--font-en); text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .stat-lbl { font-size: 0.75rem; opacity: 0.7; margin-top: 4px; font-weight: 600;}

        /* --- Search & Filters --- */
        .search-box { margin: 15px 20px; position: relative; }
        .search-input {
            width: 100%; padding: 15px 20px; border-radius: 18px; 
            background: var(--glass-bg); color: var(--text); font-size: 1rem;
            border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur);
            padding-inline-end: 45px; transition: 0.3s;
        }
        .search-input:focus { background: rgba(255,255,255,0.1); border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        .search-icon { 
            position: absolute; top: 50%; transform: translateY(-50%); opacity: 0.6; font-size: 1.2rem;
            inset-inline-end: 18px; pointer-events: none;
        }

        .stats-bar {
            display: flex; gap: 10px; overflow-x: auto; padding: 5px 20px 20px;
            scrollbar-width: none;
        }
        .stats-bar::-webkit-scrollbar { display: none; }
        .stat-chip {
            background: var(--glass-bg); padding: 10px 20px; border-radius: 50px;
            font-size: 0.9rem; font-weight: 600; white-space: nowrap; border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px); transition: 0.3s; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .stat-chip:hover { background: rgba(255,255,255,0.1); }
        .stat-chip.active { 
            background: var(--gradient-1); color: white; border-color: transparent; 
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        /* --- Cards --- */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px; padding: 0 20px 20px;
        }
        .card {
            background: var(--glass-bg); border-radius: 28px; overflow: hidden;
            display: flex; flex-direction: column; border: 1px solid var(--glass-border);
            position: relative; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: var(--glass-shadow); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:hover { transform: translateY(-8px); border-color: rgba(255,255,255,0.25); box-shadow: 0 15px 35px rgba(0,0,0,0.4); }

        /* Color Coding */
        .card::before {
            content: ''; position: absolute; top: 0; width: 6px; height: 100%; z-index: 10;
        }
        html[dir="rtl"] .card::before { right: 0; }
        html[dir="ltr"] .card::before { left: 0; }
        
        .card.p-high::before { background: linear-gradient(to bottom, var(--high), transparent); }
        .card.p-med::before { background: linear-gradient(to bottom, var(--med), transparent); }
        .card.p-low::before { background: linear-gradient(to bottom, var(--low), transparent); }

        .card-bg { height: 140px; background-size: cover; background-position: center; position: relative; }
        .card-bg::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(15, 23, 42, 0.9));
        }
        .card-body { padding: 0 20px 20px; flex-grow: 1; display: flex; flex-direction: column; position: relative; z-index: 2; }
        .card-header { margin-top: -35px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; }
        .card-title { font-size: 1.3rem; font-weight: 800; text-shadow: 0 2px 5px rgba(0,0,0,0.8); flex: 1; line-height: 1.3; }
        
        .timer-strip { 
            display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); 
            padding: 12px; border-radius: 16px; margin: 10px 0; font-family: var(--font-en);
            border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(5px);
        }
        .ts-num { font-size: 1.3rem; font-weight: 800; color: var(--text); text-shadow: 0 0 10px var(--accent-glow); }
        .ts-lbl { font-size: 0.65rem; opacity: 0.6; font-family: inherit; letter-spacing: 1px; text-transform: uppercase; }

        .progress-container { width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-top: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--gradient-1); transition: width 0.5s ease-in-out; border-radius: 10px; }

        /* --- Calendar --- */
        #calendarView { display: none; padding: 0 20px; }
        .cal-box { background: var(--glass-bg); border-radius: 28px; padding: 20px; border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-shadow); }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 20px; text-align: center; }
        .cal-day { 
            aspect-ratio: 1; background: rgba(255,255,255,0.05); border-radius: 14px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-size: 1rem; font-family: var(--font-en); position: relative; cursor: pointer;
            transition: 0.2s; border: 1px solid transparent;
        }
        .cal-day:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
        .cal-day.today { border: 1px solid var(--accent); background: rgba(99, 102, 241, 0.2); color: #fff; font-weight: bold; box-shadow: 0 0 15px var(--accent-glow); }
        .cal-day.has-event::after { content: ''; width: 6px; height: 6px; background: var(--warning); border-radius: 50%; position: absolute; bottom: 8px; box-shadow: 0 0 8px var(--warning); }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 200; display: none; align-items: flex-end; justify-content: center;
        }
        .modal {
            background: rgba(20, 25, 45, 0.85); width: 100%; max-width: 600px; padding: 30px 25px calc(25px + var(--safe-bottom));
            border-radius: 35px 35px 0 0; border: 1px solid var(--glass-border); border-bottom: none;
            max-height: 90vh; overflow-y: auto; animation: slideUp 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        @media(min-width: 768px) {
            .modal-overlay { align-items: center; }
            .modal { border-radius: 35px; border-bottom: 1px solid var(--glass-border); padding: 35px; }
        }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .form-input, .form-textarea, .form-select {
            width: 100%; padding: 18px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 18px; color: var(--text); margin-bottom: 15px; font-size: 1.05rem;
            transition: 0.3s;
        }
        .form-input:focus, .form-select:focus { background: rgba(255,255,255,0.05); border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        
        .mic-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            color: var(--accent); cursor: pointer; padding: 10px; font-size: 1.2rem;
            inset-inline-end: 10px; transition: 0.3s;
        }
        .mic-btn:hover { color: #fff; text-shadow: 0 0 10px var(--accent); }
        .mic-active { color: var(--danger); animation: pulse 1s infinite; text-shadow: 0 0 10px var(--danger); }

        /* --- Pomodoro Modal --- */
        .pomo-circle {
            width: 200px; height: 200px; border-radius: 50%; margin: 20px auto;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3); border: 4px solid var(--glass-border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 30px var(--accent-glow);
            position: relative;
        }
        .pomo-timer { font-size: 3.5rem; font-weight: 800; font-family: var(--font-en); text-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .pomo-controls { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }
        
        /* FAB */
        .fab {
            position: fixed; bottom: calc(25px + var(--safe-bottom)); 
            width: 65px; height: 65px;
            background: var(--gradient-1); border-radius: 22px; color: white; display: flex;
            align-items: center; justify-content: center; font-size: 1.8rem;
            box-shadow: 0 10px 30px var(--accent-glow); z-index: 90;
            inset-inline-start: 25px; cursor: pointer; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .fab:hover { transform: scale(1.1) rotate(90deg); }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translate(-50%, -100px);
            background: rgba(16, 185, 129, 0.85); padding: 15px 30px; border-radius: 50px;
            z-index: 300; display: flex; align-items: center; gap: 12px; color: white; font-weight: 600;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast.show { transform: translate(-50%, 0); }
        
        @keyframes pulse { 0% { transform: translateY(-50%) scale(1); } 50% { transform: translateY(-50%) scale(1.2); } 100% { transform: translateY(-50%) scale(1); } }
    </style>
</head>
<body>

    <nav class="glass-panel" style="border-radius: 0 0 24px 24px;">
        <div class="logo"><i class="fas fa-meteor fa-spin" style="--fa-animation-duration: 4s;"></i> EM<span style="color:var(--text)">10</span></div>
        <div class="nav-actions">
            <select class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar">🇺 (AR)</option>
                <option value="en">🇬🇧 (EN)</option>
                <option value="fr">🇫🇷 (FR)</option>
            </select>
            <button class="icon-btn" onclick="openPomodoro()" title="Focus Mode"><i class="fas fa-stopwatch"></i></button>
            <button class="icon-btn" onclick="toggleView()" id="viewToggleBtn"><i class="fas fa-calendar-alt"></i></button>
            <button class="icon-btn" onclick="exportData()"><i class="fas fa-download"></i></button>
            <input type="file" id="fileImport" style="display:none" onchange="importData(this)" accept=".json">
            <button class="icon-btn" onclick="document.getElementById('fileImport').click()"><i class="fas fa-upload"></i></button>
        </div>
    </nav>

    <div class="weather-widget glass-panel" onclick="fetchWeather()">
        <div style="display: flex; align-items: center; gap: 20px;">
            <i class="fas fa-cloud-sun" style="font-size: 2.5rem; color: #fff; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));"></i>
            <div>
                <div class="stat-val" id="wTemp" style="font-size: 1.8rem;">--°</div>
                <div style="font-size: 0.9rem; opacity: 0.8; font-weight: 600;" data-i18n="weather_desc">Loading...</div>
            </div>
        </div>
        <div class="stat-val" style="font-size:1.2rem; opacity:0.9; text-shadow: 0 0 15px rgba(255,255,255,0.4);" id="clockDisplay">00:00</div>
    </div>

    <div class="dashboard-row">
        <div class="stat-card">
            <i class="fas fa-flag" style="color: #818cf8; font-size: 1.5rem; margin-bottom:8px; filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.6));"></i>
            <div class="stat-val" id="statTotal">0</div>
            <div class="stat-lbl" data-i18n="stat_total">All</div>
        </div>
        <div class="stat-card">
            <i class="fas fa-check-circle" style="color: #34d399; font-size: 1.5rem; margin-bottom:8px; filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.6));"></i>
            <div class="stat-val" id="statDone">0</div>
            <div class="stat-lbl" data-i18n="stat_done">Done</div>
        </div>
        <div class="stat-card">
            <i class="fas fa-hourglass-half" style="color: #fbbf24; font-size: 1.5rem; margin-bottom:8px; filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));"></i>
            <div class="stat-val" id="statPending">0</div>
            <div class="stat-lbl" data-i18n="stat_wait">Pending</div>
        </div>
    </div>

    <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="..." onkeyup="filterSearch()">
        <i class="fas fa-search search-icon"></i>
    </div>

    <div class="stats-bar">
        <div class="stat-chip active" onclick="filterCategory('all', this)" data-i18n="cat_all">All</div>
        <div class="stat-chip" onclick="filterCategory('personal', this)" data-i18n="cat_personal">👤 Personal</div>
        <div class="stat-chip" onclick="filterCategory('work', this)" data-i18n="cat_work">💼 Work</div>
        <div class="stat-chip" onclick="filterCategory('holiday', this)" data-i18n="cat_travel">✈️ Travel</div>
        <div class="stat-chip" onclick="filterCategory('health', this)" data-i18n="cat_health">❤️ Health</div>
    </div>

    <div class="grid" id="eventsGrid"></div>
    
    <div id="calendarView">
        <div class="cal-box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <button class="icon-btn" onclick="changeMonth(-1)"><i class="fas fa-chevron-left" id="calPrevBtn"></i></button>
                <h3 id="calMonthTitle" style="font-family: var(--font-en); font-size: 1.3rem;"></h3>
                <button class="icon-btn" onclick="changeMonth(1)"><i class="fas fa-chevron-right" id="calNextBtn"></i></button>
            </div>
            <div class="cal-grid" id="calGrid"></div>
        </div>
    </div>

    <div class="fab" onclick="openModal()"><i class="fas fa-plus"></i></div>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 id="modalTitle" data-i18n="new_event" style="font-size: 1.5rem; text-shadow: 0 0 10px rgba(255,255,255,0.2);">New Event</h2>
                <button class="icon-btn" style="width: 36px; height: 36px;" onclick="closeModal('addModal')"><i class="fas fa-times"></i></button>
            </div>
            
            <div style="position: relative;">
                <input type="text" class="form-input" id="inpTitle" placeholder="..." onblur="aiAnalyze()">
                <i class="fas fa-microphone mic-btn" id="voiceBtn" onclick="startDictation('inpTitle')"></i>
            </div>
            <div id="aiSuggestion" style="font-size: 0.9rem; color: #818cf8; margin-bottom: 15px; display:none; background: rgba(99, 102, 241, 0.1); padding: 10px; border-radius: 12px; border: 1px solid rgba(99, 102, 241, 0.2);">
                <i class="fas fa-robot"></i> <span data-i18n="ai_suggest">AI Suggestion:</span> <strong id="aiCatText"></strong>
            </div>

            <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 15px;">
                <input type="datetime-local" class="form-input" id="inpDate" style="font-family: var(--font-en);">
                <select class="form-select" id="inpCat">
                    <option value="personal" data-i18n="cat_personal">Personal</option>
                    <option value="work" data-i18n="cat_work">Work</option>
                    <option value="holiday" data-i18n="cat_travel">Travel</option>
                    <option value="health" data-i18n="cat_health">Health</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button type="button" class="form-input" style="flex:1; text-align:center; padding:12px; font-weight:bold; cursor:pointer;" id="prioLow" onclick="setPriority('low')" data-i18n="prio_low">Low</button>
                <button type="button" class="form-input" style="flex:1; text-align:center; padding:12px; font-weight:bold; cursor:pointer;" id="prioMed" onclick="setPriority('med')" data-i18n="prio_med">Med</button>
                <button type="button" class="form-input" style="flex:1; text-align:center; padding:12px; font-weight:bold; cursor:pointer;" id="prioHigh" onclick="setPriority('high')" data-i18n="prio_high">High</button>
            </div>
            <input type="hidden" id="inpPriority" value="low">

            <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--glass-border);">
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="text" class="form-input" id="clInput" placeholder="Sub-task..." style="margin: 0; background: rgba(255,255,255,0.05);">
                    <button class="icon-btn" style="background: var(--gradient-1); border: none; width: 55px; height: auto;" onclick="addChecklistItem()"><i class="fas fa-plus"></i></button>
                </div>
                <div id="clList"></div>
            </div>

            <button onclick="saveEvent()" id="btnSave" style="width: 100%; padding: 18px; background: var(--gradient-1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4); transition: 0.3s;" data-i18n="btn_save">Save</button>
        </div>
    </div>

    <div class="modal-overlay" id="pomoModal">
        <div class="modal" style="text-align: center; max-width: 400px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 data-i18n="focus_mode">Focus Mode</h2>
                <button class="icon-btn" style="width: 36px; height: 36px;" onclick="closeModal('pomoModal')"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="pomo-circle" id="pomoCircle">
                <div class="pomo-timer" id="pomoDisplay">25:00</div>
            </div>

            <div class="pomo-controls">
                <button class="icon-btn" style="width:65px; height:65px; background:rgba(16, 185, 129, 0.2); border-color:var(--success); color:var(--success); font-size:1.5rem;" onclick="startPomo()"><i class="fas fa-play"></i></button>
                <button class="icon-btn" style="width:65px; height:65px; background:rgba(245, 158, 11, 0.2); border-color:var(--warning); color:var(--warning); font-size:1.5rem;" onclick="pausePomo()"><i class="fas fa-pause"></i></button>
                <button class="icon-btn" style="width:65px; height:65px; background:rgba(244, 63, 94, 0.2); border-color:var(--danger); color:var(--danger); font-size:1.5rem;" onclick="resetPomo()"><i class="fas fa-redo"></i></button>
            </div>
            <p style="margin-top:25px; opacity:0.8; font-size: 0.9rem;" data-i18n="pomo_desc">Stay focused for 25 minutes.</p>
        </div>
    </div>

    <div class="toast" id="toast"><i class="fas fa-check-circle" style="font-size: 1.2rem;"></i> <span id="toastMsg"></span></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // --- Translation & Config ---
        const dictionary = {
            ar: {
                dir: "rtl", font: "'Tajawal', sans-serif",
                appTitle: "EventMaster", search: "بحث في المهام...",
                stat_total: "الكل", stat_done: "مكتمل", stat_wait: "قيد الانتظار",
                cat_all: "الكل", cat_personal: "شخصي", cat_work: "عمل", cat_travel: "سفر", cat_health: "صحة",
                new_event: "إضافة مهمة", edit_event: "تعديل", ai_suggest: "الذكاء الاصطناعي يقترح:",
                prio_low: "عادي", prio_med: "متوسط", prio_high: "هام جداً",
                btn_save: "حفظ المهمة", weather_desc: "حالة الطقس الآن",
                time_d: "يوم", time_h: "ساعة", time_m: "دقيقة",
                focus_mode: "وضع التركيز (Pomodoro)", pomo_desc: "استمر في التركيز، لا تشتت انتباهك.",
                msg_saved: "تم الحفظ بنجاح!", msg_error: "يرجى تعبئة الحقول المطلوبة",
                months: ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"],
                days: ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت']
            },
            en: {
                dir: "ltr", font: "'Poppins', sans-serif",
                appTitle: "EventMaster", search: "Search tasks...",
                stat_total: "Total", stat_done: "Done", stat_wait: "Pending",
                cat_all: "All", cat_personal: "Personal", cat_work: "Work", cat_travel: "Travel", cat_health: "Health",
                new_event: "New Event", edit_event: "Edit Event", ai_suggest: "AI Suggests:",
                prio_low: "Low", prio_med: "Med", prio_high: "High",
                btn_save: "Save Event", weather_desc: "Current Weather",
                time_d: "Day", time_h: "Hr", time_m: "Min",
                focus_mode: "Focus Mode", pomo_desc: "Stay focused for 25 minutes.",
                msg_saved: "Saved Successfully!", msg_error: "Missing Data",
                months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
                days: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
            },
            fr: {
                dir: "ltr", font: "'Poppins', sans-serif",
                appTitle: "EventMaster", search: "Rechercher...",
                stat_total: "Total", stat_done: "Fait", stat_wait: "Attente",
                cat_all: "Tout", cat_personal: "Perso", cat_work: "Travail", cat_travel: "Voyage", cat_health: "Santé",
                new_event: "Nouvel Événement", edit_event: "Modifier", ai_suggest: "L'IA suggère:",
                prio_low: "Bas", prio_med: "Moyen", prio_high: "Haut",
                btn_save: "Enregistrer", weather_desc: "Météo Actuelle",
                time_d: "Jour", time_h: "H", time_m: "Min",
                focus_mode: "Mode Focus", pomo_desc: "Restez concentré pendant 25 minutes.",
                msg_saved: "Enregistré avec succès!", msg_error: "Données manquantes",
                months: ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"],
                days: ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam']
            }
        };

        let currentLang = localStorage.getItem('em_lang') || 'ar';
        let events = JSON.parse(localStorage.getItem('masterEventsV10_glass')) || [];
        let currentFilter = 'all';
        let currentView = 'grid';
        let editingId = null;
        let tempChecklist = [];
        let calDate = new Date();
        
        let pomoInterval;
        let pomoTime = 25 * 60;
        let isPomoRunning = false;

        document.addEventListener('DOMContentLoaded', () => {
            changeLanguage(currentLang);
            document.querySelector('.lang-select').value = currentLang;
            renderEvents();
            renderCalendar();
            updateStats();
            updateClock();
            setInterval(tick, 1000);
            fetchWeather();
            if ("Notification" in window) Notification.requestPermission();
        });

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('em_lang', lang);
            const t = dictionary[lang];
            
            document.documentElement.lang = lang;
            document.documentElement.dir = t.dir;
            document.documentElement.style.setProperty('--font-ar', t.font);
            
            if(t.dir === 'rtl') {
                document.getElementById('calPrevBtn').className = "fas fa-chevron-right";
                document.getElementById('calNextBtn').className = "fas fa-chevron-left";
            } else {
                document.getElementById('calPrevBtn').className = "fas fa-chevron-left";
                document.getElementById('calNextBtn').className = "fas fa-chevron-right";
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(t[key]) el.innerText = t[key];
            });

            document.getElementById('searchInput').placeholder = t.search;
            renderEvents();
            renderCalendar();
        }

        function getTranslation(key) { return dictionary[currentLang][key] || key; }

        function saveEvent() {
            const title = document.getElementById('inpTitle').value.trim();
            const date = document.getElementById('inpDate').value;
            
            if(!title || !date) return showToast(getTranslation('msg_error'), true);

            const eventData = {
                id: editingId || Date.now(),
                title,
                date,
                cat: document.getElementById('inpCat').value,
                priority: document.getElementById('inpPriority').value,
                checklist: tempChecklist,
                bg: `https://source.unsplash.com/800x600/?${encodeURIComponent(title)},abstract,dark`,
                notified: false
            };

            if(editingId) {
                const idx = events.findIndex(e => e.id === editingId);
                events[idx] = { ...events[idx], ...eventData };
            } else {
                events.unshift(eventData);
                confetti({ origin: { y: 0.8 }, zIndex: 500, colors: ['#6366f1', '#a855f7', '#ec4899'] });
            }

            localStorage.setItem('masterEventsV10_glass', JSON.stringify(events));
            closeModal('addModal');
            renderEvents();
            renderCalendar();
            updateStats();
            showToast(getTranslation('msg_saved'));
        }

        function renderEvents() {
            const grid = document.getElementById('eventsGrid');
            const term = document.getElementById('searchInput').value.toLowerCase();
            const t = dictionary[currentLang];
            grid.innerHTML = '';

            let filtered = events.filter(e => {
                return (currentFilter === 'all' || e.cat === currentFilter) && 
                       e.title.toLowerCase().includes(term);
            });
            
            filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

            filtered.forEach(ev => {
                const total = ev.checklist ? ev.checklist.length : 0;
                const done = ev.checklist ? ev.checklist.filter(i=>i.done).length : 0;
                const pct = total > 0 ? Math.round((done/total)*100) : 0;
                const dateObj = new Date(ev.date);

                const card = document.createElement('div');
                card.className = `card p-${ev.priority}`;
                
                let progressHTML = total > 0 ? `
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${pct}%;"></div>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="card-bg" style="background-image: url('${ev.bg}')"></div>
                    <div class="card-body">
                        <div class="card-header">
                            <h3 class="card-title">${ev.title}</h3>
                            ${total > 0 ? `<span style="font-size:0.9rem; font-weight:800; color:var(--accent); background:rgba(255,255,255,0.1); padding:4px 10px; border-radius:10px; backdrop-filter:blur(5px);">${pct}%</span>` : ''}
                        </div>
                        
                        <div class="timer-strip" id="timer-${ev.id}">
                            <div><div class="ts-num d">0</div><div class="ts-lbl">${t.time_d}</div></div>
                            <div><div class="ts-num h">0</div><div class="ts-lbl">${t.time_h}</div></div>
                            <div><div class="ts-num m">0</div><div class="ts-lbl">${t.time_m}</div></div>
                        </div>

                        ${progressHTML}

                        <div style="font-size:0.85rem; opacity:0.8; margin:15px 0 10px; display:flex; align-items:center; gap:8px;">
                            <i class="far fa-calendar-alt" style="color:var(--accent)"></i> 
                            ${dateObj.toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-GB')}
                            <i class="far fa-clock" style="color:var(--accent); margin-inline-start:10px;"></i>
                            ${dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                        </div>
                        
                        <div style="margin-top:auto; padding-top:15px; border-top:1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:center;">
                            <span class="stat-chip" style="font-size:0.8rem; padding: 6px 12px; pointer-events:none; box-shadow:none;">${getTranslation('cat_'+ev.cat)}</span>
                            <div style="display:flex; gap:8px;">
                                <button class="icon-btn" style="width:35px; height:35px;" onclick="editEvent(${ev.id})"><i class="fas fa-pen" style="font-size:0.8rem;"></i></button>
                                <button class="icon-btn" style="width:35px; height:35px; background:rgba(244, 63, 94, 0.1); border-color:var(--danger); color:var(--danger);" onclick="deleteEvent(${ev.id})"><i class="fas fa-trash" style="font-size:0.8rem;"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            tick();
        }

        function tick() {
            const now = new Date().getTime();
            events.forEach(ev => {
                const el = document.getElementById(`timer-${ev.id}`);
                if(!el) return;
                const target = new Date(ev.date).getTime();
                let diff = target - now;
                
                if(diff <= 0 && diff > -60000 && !ev.notified) {
                    if(Notification.permission === "granted") new Notification(dictionary[currentLang].appTitle, { body: ev.title });
                    ev.notified = true;
                    localStorage.setItem('masterEventsV10_glass', JSON.stringify(events));
                }

                if(diff < 0) {
                    el.style.opacity = '0.3';
                    el.querySelector('.d').innerText = "0";
                    return;
                }
                
                el.querySelector('.d').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                el.querySelector('.h').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                el.querySelector('.m').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            });
        }

        function openPomodoro() { document.getElementById('pomoModal').style.display = 'flex'; }
        function startPomo() {
            if(isPomoRunning) return;
            isPomoRunning = true;
            document.getElementById('pomoCircle').style.boxShadow = "inset 0 0 20px rgba(0,0,0,0.5), 0 0 40px var(--success)";
            pomoInterval = setInterval(() => {
                pomoTime--;
                updatePomoDisplay();
                if(pomoTime <= 0) {
                    clearInterval(pomoInterval);
                    isPomoRunning = false;
                    document.getElementById('pomoCircle').style.boxShadow = "inset 0 0 20px rgba(0,0,0,0.5), 0 0 30px var(--accent-glow)";
                    new Notification("EventMaster", { body: "Pomodoro Finished! Take a break." });
                    showToast("Focus Session Done!");
                }
            }, 1000);
        }
        function pausePomo() { clearInterval(pomoInterval); isPomoRunning = false; document.getElementById('pomoCircle').style.boxShadow = "inset 0 0 20px rgba(0,0,0,0.5), 0 0 30px var(--warning)";}
        function resetPomo() { pausePomo(); pomoTime = 25 * 60; updatePomoDisplay(); document.getElementById('pomoCircle').style.boxShadow = "inset 0 0 20px rgba(0,0,0,0.5), 0 0 30px var(--accent-glow)";}
        function updatePomoDisplay() {
            const m = Math.floor(pomoTime / 60).toString().padStart(2, '0');
            const s = (pomoTime % 60).toString().padStart(2, '0');
            document.getElementById('pomoDisplay').innerText = `${m}:${s}`;
        }

        function openModal() {
            editingId = null;
            tempChecklist = [];
            document.getElementById('modalTitle').innerText = getTranslation('new_event');
            document.getElementById('inpTitle').value = '';
            const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            document.getElementById('inpDate').value = d.toISOString().slice(0,16);
            document.getElementById('aiSuggestion').style.display = 'none';
            setPriority('low');
            renderChecklist();
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function editEvent(id) {
            const e = events.find(x => x.id === id);
            editingId = id;
            tempChecklist = [...(e.checklist || [])];
            document.getElementById('modalTitle').innerText = getTranslation('edit_event');
            document.getElementById('inpTitle').value = e.title;
            document.getElementById('inpDate').value = e.date;
            document.getElementById('inpCat').value = e.cat;
            setPriority(e.priority);
            renderChecklist();
            document.getElementById('addModal').style.display = 'flex';
        }

        function deleteEvent(id) {
            if(confirm('هل أنت متأكد من الحذف؟')) {
                events = events.filter(e => e.id !== id);
                localStorage.setItem('masterEventsV10_glass', JSON.stringify(events));
                renderEvents();
                updateStats();
            }
        }

        function setPriority(p) {
            document.getElementById('inpPriority').value = p;
            document.querySelectorAll('#prioLow, #prioMed, #prioHigh').forEach(b => {
                b.style.background = 'rgba(0,0,0,0.3)';
                b.style.border = '1px solid var(--glass-border)';
            });
            const map = { low: 'rgba(59, 130, 246, 0.3)', med: 'rgba(249, 115, 22, 0.3)', high: 'rgba(239, 68, 68, 0.3)' };
            const borderMap = { low: 'var(--low)', med: 'var(--med)', high: 'var(--high)' };
            const idMap = { low: 'prioLow', med: 'prioMed', high: 'prioHigh' };
            const el = document.getElementById(idMap[p]);
            el.style.background = map[p];
            el.style.border = `1px solid ${borderMap[p]}`;
        }

        function addChecklistItem() {
            const val = document.getElementById('clInput').value.trim();
            if(val) {
                tempChecklist.push({text: val, done: false});
                document.getElementById('clInput').value = '';
                renderChecklist();
            }
        }

        function renderChecklist() {
            const list = document.getElementById('clList');
            list.innerHTML = '';
            tempChecklist.forEach((item, idx) => {
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; padding:12px 15px; background:rgba(255,255,255,0.08); margin-bottom:8px; border-radius:12px; align-items:center; border: 1px solid rgba(255,255,255,0.05); transition:0.3s;">
                        <div style="display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="tempChecklist[${idx}].done = !tempChecklist[${idx}].done; renderChecklist()">
                            <i class="${item.done ? 'fas fa-check-circle' : 'far fa-circle'}" style="color:${item.done ? 'var(--success)' : 'rgba(255,255,255,0.5)'}; font-size:1.2rem;"></i>
                            <span style="opacity:${item.done?0.5:1}; text-decoration:${item.done?'line-through':''}; font-size:1rem;">${item.text}</span>
                        </div>
                        <i class="fas fa-times" style="color:var(--danger); cursor:pointer; padding:5px;" onclick="tempChecklist.splice(${idx},1); renderChecklist()"></i>
                    </div>`;
            });
        }

        function renderCalendar() {
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            const t = dictionary[currentLang];
            const mTitle = document.getElementById('calMonthTitle');
            
            mTitle.innerHTML = `${t.months[calDate.getMonth()]} <span style="font-family:var(--font-en); color:var(--accent);">${calDate.getFullYear()}</span>`;

            t.days.forEach(d => grid.innerHTML += `<div style="font-size:0.85rem; opacity:0.6; font-weight:bold; margin-bottom:5px;">${d}</div>`);
            
            const firstDay = new Date(calDate.getFullYear(), calDate.getMonth(), 1).getDay();
            for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;

            const daysInMonth = new Date(calDate.getFullYear(), calDate.getMonth() + 1, 0).getDate();

            for(let i=1; i<=daysInMonth; i++) {
                const dayStr = `${calDate.getFullYear()}-${String(calDate.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const hasEvent = events.some(e => e.date.startsWith(dayStr));
                const isToday = new Date().toDateString() === new Date(calDate.getFullYear(), calDate.getMonth(), i).toDateString();
                
                const el = document.createElement('div');
                el.className = `cal-day ${isToday?'today':''} ${hasEvent?'has-event':''}`;
                el.innerText = i;
                el.onclick = () => {
                    document.getElementById('inpDate').value = `${dayStr}T09:00`;
                    openModal();
                };
                grid.appendChild(el);
            }
        }
        
        function changeMonth(d) { calDate.setMonth(calDate.getMonth() + d); renderCalendar(); }
        function toggleView() {
            currentView = currentView === 'grid' ? 'calendar' : 'grid';
            document.getElementById('eventsGrid').style.display = currentView === 'grid' ? 'grid' : 'none';
            document.getElementById('calendarView').style.display = currentView === 'calendar' ? 'block' : 'none';
        }

        function startDictation(id) {
            if ('webkitSpeechRecognition' in window) {
                const r = new webkitSpeechRecognition();
                r.lang = currentLang === 'ar' ? 'ar-EG' : (currentLang === 'fr' ? 'fr-FR' : 'en-US');
                const btn = document.getElementById('voiceBtn');
                btn.classList.add('mic-active');
                r.onresult = (e) => {
                    document.getElementById(id).value = e.results[0][0].transcript;
                    btn.classList.remove('mic-active');
                    aiAnalyze();
                };
                r.start();
            } else alert("ميزة التحدث غير مدعومة في هذا المتصفح");
        }

        function aiAnalyze() {
            const title = document.getElementById('inpTitle').value.toLowerCase();
            const box = document.getElementById('aiSuggestion');
            const map = {
                work: ['meeting', 'call', 'report', 'boss', 'اجتماع', 'مدير', 'مشروع', 'مكالمة', 'travail', 'réunion'],
                holiday: ['fly', 'trip', 'hotel', 'سفر', 'فندق', 'رحلة', 'طيران', 'voyage', 'vol'],
                health: ['gym', 'doctor', 'med', 'دكتور', 'رياضة', 'جيم', 'طبيب', 'دواء', 'sport', 'médecin']
            };
            
            let detected = null;
            for(const [k, v] of Object.entries(map)) if(v.some(x => title.includes(x))) detected = k;

            if(detected) {
                document.getElementById('inpCat').value = detected;
                document.getElementById('aiCatText').innerText = getTranslation('cat_'+detected);
                box.style.display = 'block';
                box.style.animation = 'pulse 1s';
            }
        }

        async function fetchWeather() {
            if(!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true`);
                    const d = await r.json();
                    document.getElementById('wTemp').innerText = `${Math.round(d.current_weather.temperature)}°C`;
                } catch(e) {}
            });
        }

        function filterCategory(c, el) {
            currentFilter = c;
            document.querySelectorAll('.stat-chip').forEach(x => x.classList.remove('active'));
            el.classList.add('active');
            renderEvents();
        }

        function filterSearch() { renderEvents(); }

        function updateStats() {
            document.getElementById('statTotal').innerText = events.length;
            const done = events.filter(e => e.checklist && e.checklist.length && e.checklist.every(x=>x.done)).length;
            document.getElementById('statDone').innerText = done;
            document.getElementById('statPending').innerText = events.length - done;
        }

        function updateClock() {
            const d = new Date();
            document.getElementById('clockDisplay').innerText = 
                `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
            setTimeout(updateClock, 10000);
        }

        function showToast(msg, err=false) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.style.background = err ? 'rgba(244, 63, 94, 0.9)' : 'rgba(16, 185, 129, 0.9)';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        
        function exportData() {
            const a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(events));
            a.download = "master_glass_backup.json";
            a.click();
        }
        
        function importData(inp) {
            const f = inp.files[0];
            if(!f) return;
            const r = new FileReader();
            r.onload = (e) => {
                try {
                    events = [...JSON.parse(e.target.result), ...events];
                    localStorage.setItem('masterEventsV10_glass', JSON.stringify(events));
                    renderEvents();
                    showToast(getTranslation('msg_saved'));
                } catch(x){ showToast("خطأ في الملف", true); }
            };
            r.readAsText(f);
        }
    </script>
</body>
</html>
